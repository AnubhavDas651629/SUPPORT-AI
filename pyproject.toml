[project]
name = "support-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asgi-correlation-id>=5.0.1",
    "asyncpg>=0.31.0",
    "boto3>=1.43.63",
    "celery>=5.6.3",
    "fastapi[standard]>=0.138.2",
    "google-auth>=2.56.2",
    "greenlet>=3.5.3",
    "openai>=2.44.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "pandas>=3.0.5",
    "passlib[bcrypt]>=1.7.4",
    "pgvector>=0.5.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "psycopg2-binary>=2.9.12",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "python-slugify>=8.0.4",
    "redis>=8.0.1",
    "requests>=2.34.2",
    "sentry-sdk[fastapi]>=2.64.0",
    "sqlalchemy>=2.0.51",
    "stripe>=15.4.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
